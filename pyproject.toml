[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nova2026"
version = "0.1.0"
description = "NOVA2026 Buildathon Project"
authors = [
    { name = "Yanye Lin", email = "kineticjetice245@gmail.com" },
    { name = "Floryan Lacroix", email = "floryan.lacroix@gmail.com"},
    { name = "Selina Zhou", email = "selinazh06@gmail.com"},
    { name = "Yutong Lu", email = "luyutong505531@gmail.com"}
]
readme = "README.md"
# license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mne>=1.12",
    "numpy>=2.5",
    "scipy>=1.18",
    "matplotlib>=3.11",
    "pandas>=3.0.5",
    "torch>=2.0",
    "torchvision>=0.17",
    "scikit-learn>=1.9.0",
    "soxr>=1.1.0",
    "mne-lsl>=1.14.0",
]

#
# [tool.uv.sources]
# torch = { index = "pytorch-cu132" }
# torchvision = { index = "pytorch-cu132" }
#
# [[tool.uv.index]]
# name = "pytorch-cu132"
# url = "https://download.pytorch.org/whl/cu132"
# explicit = true
#

[project.optional-dependencies]
audio = ["sounddevice>=0.4"]
# The demo's transport (step 6): one same-origin FastAPI process serving /api/*,
# /ws/live and the built frontend, plus the WebSocket protocol implementation
# uvicorn runs. Pinned to the combination the teammate's attune-ui backend
# validated. httpx is needed only by the tests (fastapi.testclient / ASGI
# transport); nothing in the running demo imports it.
transport = [
    "fastapi==0.128.8",
    "uvicorn==0.39.0",
    "websockets==15.0.1",
    "anyio==4.12.1",
    "httpx==0.28.1",
]
# Reading the ANT Neuro .cnt recordings of the real rig needs antio; MNE's
# read_raw_cnt is for NeuroScan files and fails on these with a misleading
# "Event table offset ... larger than file size". Optional, not core: only the
# hardware-facing import path needs it.
eeg-ant = ["antio>=0.7.1"]
dev = []

[tool.setuptools]
package-dir = { "" = "src" } # src as root

[tool.setuptools.packages.find]
where = ["src"] # packages are under src
