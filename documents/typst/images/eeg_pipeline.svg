<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1600" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">EEG Processing Pipeline — Engagement Score</text>
  <text x="800" y="74" text-anchor="middle" font-size="14" fill="#94a3b8">25 users × 3 sessions × 90 trials × 62 channels × 256 data points</text>

  <!-- ===================== Stage 1 ===================== -->
  <g transform="translate(40, 120)">
    <!-- stack of 3 rectangles -->
    <g>
      <rect x="0"  y="0" width="150" height="34" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0"  y="14" width="150" height="34" rx="6" fill="#bae6fd" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0"  y="28" width="150" height="34" rx="6" fill="#7dd3fc" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
    </g>
    <text x="75" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e">25 users</text>
    <text x="75" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e">3 sessions</text>
    <text x="75" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e">EEG 500 Hz</text>
  </g>

  <line x1="210" y1="180" x2="280" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- notch + filter + resample + filter + center scale clip -->
  <g transform="translate(290, 118)">
    <rect x="0" y="0" width="250" height="124" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="125" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Preprocessing</text>
    <line x1="30" y1="32" x2="220" y2="32" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <text x="125" y="50" text-anchor="middle" font-size="12" fill="#78350f">notch filter</text>
    <text x="125" y="68" text-anchor="middle" font-size="12" fill="#78350f">band-pass filter</text>
    <text x="125" y="86" text-anchor="middle" font-size="12" fill="#78350f">resample → 128 Hz</text>
    <text x="125" y="104" text-anchor="middle" font-size="12" fill="#78350f">band-pass filter</text>
    <text x="125" y="120" text-anchor="middle" font-size="12" fill="#78350f">center · scale · clip</text>
  </g>

  <line x1="560" y1="180" x2="630" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== Stage 2 ===================== -->
  <g transform="translate(640, 120)">
    <g>
      <rect x="0"  y="0" width="150" height="34" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0"  y="14" width="150" height="34" rx="6" fill="#bae6fd" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0"  y="28" width="150" height="34" rx="6" fill="#7dd3fc" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
    </g>
    <text x="75" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e">25 users</text>
    <text x="75" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e">3 sessions</text>
    <text x="75" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e">EEG 128 Hz</text>
  </g>

  <line x1="810" y1="180" x2="880" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- slicing into windows -->
  <g transform="translate(890, 128)">
    <rect x="0" y="0" width="190" height="104" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="95" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Epoching</text>
    <line x1="30" y1="32" x2="160" y2="32" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <text x="95" y="52" text-anchor="middle" font-size="12" fill="#78350f">slicing into</text>
    <text x="95" y="70" text-anchor="middle" font-size="12" fill="#78350f">windows</text>
    <text x="95" y="90" text-anchor="middle" font-size="12" fill="#78350f">(trials)</text>
  </g>

  <line x1="1100" y1="180" x2="1170" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== Stage 3 ===================== -->
  <g transform="translate(1180, 120)">
    <g>
      <rect x="0"  y="0" width="200" height="34" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0"  y="14" width="200" height="34" rx="6" fill="#bae6fd" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0"  y="28" width="200" height="34" rx="6" fill="#7dd3fc" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
    </g>
    <text x="100" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#0c4a6e">25 × 3 × 90 trials</text>
    <text x="100" y="52" text-anchor="middle" font-size="12" font-weight="600" fill="#0c4a6e">62 channels</text>
    <text x="100" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#0c4a6e">256 data points</text>
  </g>

  <line x1="1400" y1="180" x2="1470" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- package -->
  <g transform="translate(1480, 128)">
    <rect x="0" y="0" width="90" height="104" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="45" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">package</text>
  </g>

  <g transform="translate(640, 320)">
    <g>
      <rect x="0"  y="0" width="250" height="34" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0"  y="14" width="250" height="34" rx="6" fill="#d1fae5" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0"  y="28" width="250" height="34" rx="6" fill="#a7f3d0" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    </g>
    <text x="125" y="20" text-anchor="middle" font-size="12.5" font-weight="600" fill="#064e3b">data</text>
    <text x="125" y="52" text-anchor="middle" font-size="12.5" font-weight="600" fill="#064e3b">6750 × 62 × 256</text>
    <text x="125" y="84" text-anchor="middle" font-size="12.5" font-weight="600" fill="#064e3b">(128 Hz)</text>
  </g>

  <!-- connector from package down-left to data -->
  <path d="M 1525 232 L 1525 260 L 850 260 L 850 316" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ===================== PSD (Welch) ===================== -->
  <line x1="910" y1="377" x2="980" y2="377" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(990, 325)">
    <rect x="0" y="0" width="280" height="104" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="140" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">PSD — Welch's method</text>
    <line x1="30" y1="32" x2="250" y2="32" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <text x="140" y="52" text-anchor="middle" font-size="12" fill="#78350f">fmin = 4 Hz</text>
    <text x="140" y="70" text-anchor="middle" font-size="12" fill="#78350f">fmax = 20 Hz</text>
    <text x="140" y="88" text-anchor="middle" font-size="12" fill="#78350f">(frequency resolution)</text>
  </g>

  <line x1="1290" y1="377" x2="1360" y2="377" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- psd data -->
  <g transform="translate(1370, 320)">
    <g>
      <rect x="0"  y="0" width="200" height="34" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0"  y="14" width="200" height="34" rx="6" fill="#d1fae5" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0"  y="28" width="200" height="34" rx="6" fill="#a7f3d0" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    </g>
    <text x="100" y="20" text-anchor="middle" font-size="12.5" font-weight="600" fill="#064e3b">psd</text>
    <text x="100" y="52" text-anchor="middle" font-size="12.5" font-weight="600" fill="#064e3b">6750 × 62 × [4–20]</text>
    <text x="100" y="84" text-anchor="middle" font-size="12.5" font-weight="600" fill="#064e3b">(128 Hz)</text>
  </g>

  <!-- ===================== Band power ===================== -->
  <path d="M 1570 377 L 1570 500 L 420 500 L 420 556" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(420, 560)">
    <rect x="0" y="0" width="220" height="104" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="110" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Band power</text>
    <line x1="30" y1="32" x2="190" y2="32" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <text x="110" y="52" text-anchor="middle" font-size="12" fill="#78350f">integrate PSD over</text>
    <text x="110" y="70" text-anchor="middle" font-size="12" fill="#78350f">frequency bands</text>
    <text x="110" y="90" text-anchor="middle" font-size="12" fill="#78350f">(θ / α / β)</text>
  </g>

  <line x1="660" y1="612" x2="730" y2="612" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- bd data -->
  <g transform="translate(740, 555)">
    <g>
      <rect x="0"  y="0" width="220" height="34" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0"  y="14" width="220" height="34" rx="6" fill="#d1fae5" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0"  y="28" width="220" height="34" rx="6" fill="#a7f3d0" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    </g>
    <text x="110" y="20" text-anchor="middle" font-size="12.5" font-weight="600" fill="#064e3b">bd</text>
    <text x="110" y="52" text-anchor="middle" font-size="12.5" font-weight="600" fill="#064e3b">3 freq bands ×</text>
    <text x="110" y="84" text-anchor="middle" font-size="12.5" font-weight="600" fill="#064e3b">6750 × 62</text>
  </g>

  <line x1="980" y1="612" x2="1050" y2="612" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== Engagement score ===================== -->
  <g transform="translate(1060, 555)">
    <rect x="0" y="0" width="240" height="104" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="120" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Engagement score</text>
    <line x1="30" y1="32" x2="210" y2="32" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <text x="120" y="52" text-anchor="middle" font-size="12" fill="#78350f">compute engagement</text>
    <text x="120" y="70" text-anchor="middle" font-size="12" fill="#78350f">from band powers</text>
    <text x="120" y="90" text-anchor="middle" font-size="12" fill="#78350f">(combination rule)</text>
  </g>

  <line x1="1320" y1="612" x2="1390" y2="612" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- engagement score data -->
  <g transform="translate(1400, 555)">
    <g>
      <rect x="0"  y="0" width="180" height="34" rx="6" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0"  y="14" width="180" height="34" rx="6" fill="#ddd6fe" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0"  y="28" width="180" height="34" rx="6" fill="#c4b5fd" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    </g>
    <text x="90" y="20" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4c1d95">engagement</text>
    <text x="90" y="52" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4c1d95">score</text>
    <text x="90" y="84" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4c1d95">6750 × 62</text>
  </g>
</svg>
