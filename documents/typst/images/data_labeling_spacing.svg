<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- time axis -->
  <line x1="60" y1="185" x2="760" y2="185" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="52" y="165" font-size="12" fill="#333" text-anchor="middle">Time</text>

  <!-- previous response/error marker -->
  <line x1="170" y1="140" x2="170" y2="200" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="170" cy="150" r="5" fill="#c0392b"/>
  <text x="170" y="130" fill="#c0392b" font-weight="bold" text-anchor="middle">Previous response/error (14)</text>

  <!-- 200 ms buffer -->
  <rect x="170" y="170" width="36" height="30" fill="#e67e22" fill-opacity="0.45" stroke="#e67e22" stroke-width="2"/>
  <text x="188" y="217" fill="#935116" font-weight="bold" text-anchor="middle">200 ms — buffer</text>
  <text x="188" y="233" fill="#935116" font-size="11" text-anchor="middle">(residual activity clears)</text>

  <!-- 2000 ms segment -->
  <rect x="206" y="170" width="360" height="30" fill="#2980b9" fill-opacity="0.35" stroke="#2980b9" stroke-width="2"/>
  <text x="386" y="217" fill="#1a5276" font-weight="bold" text-anchor="middle">2000 ms — extracted EEG segment</text>
  <text x="386" y="233" fill="#1a5276" font-size="11" text-anchor="middle">(clear of previous event)</text>

  <!-- 100 ms gap before stimulus -->
  <rect x="566" y="170" width="18" height="30" fill="#8e44ad" fill-opacity="0.30" stroke="#8e44ad" stroke-width="2"/>
  <text x="575" y="217" fill="#6c3483" font-weight="bold" font-size="11" text-anchor="middle">100 ms — gap</text>
  <text x="575" y="233" fill="#6c3483" font-size="10" text-anchor="middle">(no stimulus-evoked response)</text>

  <!-- stimulus onset marker -->
  <line x1="584" y1="140" x2="584" y2="200" stroke="#2980b9" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="584" cy="150" r="5" fill="#2980b9"/>
  <text x="584" y="130" fill="#1a5276" font-weight="bold" text-anchor="middle">Stimulus onset (13)</text>

  <!-- reaction time -->
  <line x1="584" y1="150" x2="730" y2="150" stroke="#27ae60" stroke-width="2"/>
  <polygon points="720,145 730,150 720,155" fill="#27ae60"/>
  <line x1="730" y1="140" x2="730" y2="200" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="730" cy="150" r="5" fill="#27ae60"/>
  <text x="657" y="143" fill="#1e8449" font-weight="bold" text-anchor="middle">Reaction time</text>
  <text x="730" y="130" fill="#1e8449" font-weight="bold" text-anchor="middle">Response (14)</text>
</svg>
